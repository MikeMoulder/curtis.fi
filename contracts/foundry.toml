[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.28"
optimizer = true
optimizer_runs = 200
via_ir = true

# CRITICAL — BOT Chain runs Geth v1.5.13, which does not support PUSH0.
# Compiling for cancun (the solc default) produces bytecode that deploys
# successfully and then reverts on every single call. Do not change this.
evm_version = "paris"

remappings = [
  "@openzeppelin/=lib/openzeppelin-contracts/",
  "forge-std/=lib/forge-std/src/",
]

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = false

[rpc_endpoints]
botchain = "https://rpc.botchain.ai"
bohr = "https://rpc.bohr.life"

[etherscan]
botchain = { key = "blockscout", chain = 677, url = "https://scan.botchain.ai/api" }
bohr = { key = "blockscout", chain = 968, url = "https://scan.bohr.life/api" }
